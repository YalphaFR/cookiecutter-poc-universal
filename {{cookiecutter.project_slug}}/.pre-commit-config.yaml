repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.6.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

  # Condition Jinja pour ajouter ESLint si c'est du JS
  {% if cookiecutter.language == "javascript" %}
  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v9.17.0
    hooks:
      - id: eslint
        additional_dependencies: ["eslint", "typescript-eslint"]
  {% endif %}

  # Condition Jinja pour ajouter Ruff si c'est du Python
  {% if cookiecutter.language == "python" %}
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
      - id: ruff-format
  {% endif %}
